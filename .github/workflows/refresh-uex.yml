name: Refresh UEX prices

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Request a signed UEX refresh
        env:
          WIKELO_IMPORT_SECRET: ${{ secrets.WIKELO_IMPORT_SECRET }}
          WIKELO_SYNC_ORIGIN: ${{ vars.WIKELO_SYNC_ORIGIN }}
          UEX_API_TOKEN: ${{ secrets.UEX_API_TOKEN }}
        run: |
          test -n "$WIKELO_IMPORT_SECRET"
          test -n "$WIKELO_SYNC_ORIGIN"
          npx tsx scripts/sync-uex-prices.ts "$WIKELO_SYNC_ORIGIN"
